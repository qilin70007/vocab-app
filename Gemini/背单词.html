<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026上海初中英语考纲词汇背诵助手</title>
    <!-- 引入 Tailwind CSS 用于快速美化界面 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Vue 3 用于处理软件逻辑 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <!-- 头部导航 -->
        <header class="text-center my-6">
            <h1 class="text-xl font-bold text-blue-600">2026上海初中英语考纲词汇</h1>
            <p class="text-xs text-gray-500 mt-1">高效背诵辅助工具</p>
        </header>

        <!-- 筛选过滤器 -->
        <div class="bg-white rounded-xl shadow-xs p-3 mb-4 flex justify-around text-sm">
            <button @click="filterType = 'all'" :class="filterType === 'all' ? 'text-blue-600 font-bold' : 'text-gray-500'">
                全部 ({{ words.length }})
            </button>
            <button @click="filterType = 'unlearned'" :class="filterType === 'unlearned' ? 'text-red-500 font-bold' : 'text-gray-500'">
                ❌ 未背过/不认识 ({{ unlearnedCount }})
            </button>
            <button @click="filterType = 'learned'" :class="filterType === 'learned' ? 'text-green-600 font-bold' : 'text-gray-500'">
                ✅ 已掌握 ({{ learnedCount }})
            </button>
        </div>

        <!-- 单词卡片列表 -->
        <main class="flex-1 space-y-3 overflow-y-auto max-h-[70vh]">
            <div v-for="item in filteredWords" :key="item.id" 
                 class="bg-white rounded-xl p-4 shadow-xs border-l-4 transition-all"
                 :class="item.status === 1 ? 'border-green-500 opacity-60' : 'border-red-400'">
                
                <div class="flex justify-between items-start">
                    <div>
                        <!-- 单词与音标 -->
                        <h2 class="text-lg font-bold tracking-wide">{{ item.word }}</h2>
                        <span class="text-xs font-mono text-gray-400 block my-0.5">{{ item.phonetic }}</span>
                        <!-- 释义 -->
                        <p class="text-sm text-gray-600 mt-1">{{ item.translation }}</p>
                    </div>
                    
                    <!-- 状态切换按钮 -->
                    <button @click="toggleStatus(item.id)" 
                            class="px-3 py-1 rounded-full text-xs font-medium transition-colors"
                            :class="item.status === 1 ? 'bg-green-100 text-green-700 hover:bg-green-200' : 'bg-red-100 text-red-700 hover:bg-red-200'">
                        {{ item.status === 1 ? '已掌握' : '不认识' }}
                    </button>
                </div>
            </div>

            <!-- 空状态提示 -->
            <div v-if="filteredWords.length === 0" class="text-center py-12 text-gray-400 text-sm">
                这里空空如也，切换分类看看吧~
            </div>
        </main>

        <!-- 底部清除缓存（重置） -->
        <footer class="mt-auto pt-4 text-center">
            <button @click="resetData" class="text-xs text-gray-400 hover:text-red-500 underline">
                重置所有单词状态
            </button>
        </footer>
    </div>

    <script>
        const { createApp, ref, computed, watch } = Vue;

        // 初始考纲词汇数据样本（包含PDF前五词作为演示，可按此格式无限追加）
        const defaultWords = [
            { id: 1, word: "ability", phonetic: "//ə'bıləti//", translation: "n. 能力，才能，本领 [💡扩展: able, enable, disable]" },
            { id: 2, word: "able", phonetic: "//'eibl//", translation: "adj. 能够的；有能力的" },
            { id: 3, word: "about", phonetic: "//ə'baut//", translation: "adv. 大约；到处 prep. 关于" },
            { id: 4, word: "above", phonetic: "//ə'bav//", translation: "prep. 在……上面 adv. 超过，更多 [💡注意: 与 over, on 的区别]" },
            { id: 5, word: "abroad", phonetic: "//ə'b\u0254:d//", translation: "adv. 到(在)国外 [💡搭配: go abroad, live abroad]" }
        ];

        createApp({
            setup() {
                // 优先从浏览器本地存储读取数据，如果没有则使用默认数据
                const localData = localStorage.getItem('sh_zk_words');
                const words = ref(localData ? JSON.parse(localData) : defaultWords.map(w => ({...w, status: 0})));
                
                // 筛选类型：all(全部), unlearned(未背过), learned(已掌握)
                const filterType = ref('all');

                // 统计数量
                const unlearnedCount = computed(() => words.value.filter(w => w.status === 0).length);
                const learnedCount = computed(() => words.value.filter(w => w.status === 1).length);

                // 根据筛选类型过滤单词列表
                const filteredWords = computed(() => {
                    if (filterType.value === 'unlearned') {
                        return words.value.filter(w => w.status === 0);
                    } else if (filterType.value === 'learned') {
                        return words.value.filter(w => w.status === 1);
                    }
                    return words.value;
                });

                // 切换单词状态（认识/不认识）
                const toggleStatus = (id) => {
                    const word = words.value.find(w => w.id === id);
                    if (word) {
                        word.status = word.status === 0 ? 1 : 0;
                    }
                };

                // 监听数据变化，实时保存到浏览器本地
                watch(words, (newVal) => {
                    localStorage.setItem('sh_zk_words', JSON.stringify(newVal));
                }, { deep: true });

                // 重置所有单词为未背过状态
                const resetData = () => {
                    if (confirm('确定要清空所有的背诵进度，重新开始吗？')) {
                        words.value.forEach(w => w.status = 0);
                    }
                };

                return {
                    words,
                    filterType,
                    filteredWords,
                    unlearnedCount,
                    learnedCount,
                    toggleStatus,
                    resetData
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
